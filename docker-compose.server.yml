# Server-only override: enables HTTPS with a self-signed cert (LAN use).
# NOT used on the dev machine.
#
# Usage on the server (laptop):
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up --build -d
#
# Then browse to https://<laptop-LAN-IP>:6767 and click through the one-time
# "not private" warning. Everything after that is HTTPS — no more blank pages
# from browsers force-upgrading insecure origins.
#
# A plain-HTTP port (8080) redirects to HTTPS, so typing the bare host works.

services:
  app:
    ports:
      - "6767:6767"
      - "8080:8080"
    environment:
      HTTPS: "1"
      HTTPS_PORT: "6767"
      HTTP_PORT: "8080"
