services:
  app:
    build: .
    # Run as root so writes to the named volumes (uploads, TLS certs) work.
    # Named volumes are root-owned by default; the image's `node` user can't
    # write to them. Fine for a LAN container.
    user: "0:0"
    ports:
      - "6767:6767"
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      MEDIA_DIR: /data/media
      DATA_DIR: /data
      EMBED_API_URL: http://embed-api:8787
    volumes:
      - media_data:/data/media
      - tls_data:/data/tls
      - ./data:/app/data:ro
    depends_on:
      mongo:
        condition: service_healthy
      embed-api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:6767/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Stream source aggregator: queries 13 embed providers and returns direct
  # stream URLs (HLS/MP4). Internal only — CineVault proxies it under
  # /embed-proxy so the browser never talks to it directly.
  embed-api:
    image: inside4ndroid/tmdb-embed-api:latest
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      ENABLE_PROXY: "true"
      API_PORT: "8787"
    volumes:
      - embed_api_config:/app/utils
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  media_data:
  mongo_data:
  tls_data:
  embed_api_config:
